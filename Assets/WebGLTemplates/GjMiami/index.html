<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="theme-color" content="#000000">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <!-- Save do site: precisam rodar antes do jogo abrir -->
    <script src="unlock-all.js"></script>
    <script src="infinite-save.js"></script>
    <style>
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background: #000;
        /* celular: sem rolar, sem zoom de pinça, sem seleção, sem menu de toque longo */
        touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      }
      body { position: fixed; inset: 0; }
      /* o jogo é em pé: no celular ocupa a tela toda; em tela larga fica no meio, no máximo 3:4 */
      #gj-box {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        height: 100%; width: min(100%, 75vh);
        height: 100dvh; width: min(100vw, 75dvh);
      }
      #unity-canvas { display: block; width: 100%; height: 100%; background: #000; outline: none; touch-action: none; }
      /* carregamento: o mesmo de antes (logo da Unity + barra), do TemplateData/style.css */
      #unity-loading-bar { display: block; }
      #gj-error {
        display: none; position: absolute; left: 8%; right: 8%; top: 40%; padding: 14px;
        background: #b00020; color: #fff; font: 15px/1.4 sans-serif; text-align: center; border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div id="gj-box">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="gj-error"></div>
    </div>
    <script>
      (function () {
        var canvas = document.getElementById("unity-canvas");
        var fill = document.getElementById("unity-progress-bar-full");
        var loading = document.getElementById("unity-loading-bar");
        var errorBox = document.getElementById("gj-error");
        var mobile = /iPhone|iPad|iPod|Android|Mobile/i.test(navigator.userAgent) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        window.gjIsMobile = mobile;

        // toque longo não abre menu, e arrastar não rola a página
        document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
        document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
        // devolve o foco ao jogo ao tocar/clicar (teclado volta a funcionar)
        canvas.addEventListener("pointerdown", function () { canvas.focus(); });

        var buildUrl = "Build";
        var config = {
          dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
          frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
          codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
          memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
          symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
          streamingAssetsUrl: "StreamingAssets",
          companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
          productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
          productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
          // menos trabalho por quadro: sem anti-aliasing, e pede a placa de vídeo forte
          webglContextAttributes: { antialias: false, preserveDrawingBuffer: false, powerPreference: "high-performance" },
          showBanner: function (msg, type) { if (type === "error") showError(msg); else console.warn(msg); }
        };

        function showError(msg) {
          loading.style.display = "none";
          errorBox.textContent = msg;
          errorBox.style.display = "block";
        }

        var script = document.createElement("script");
        script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
        script.onload = function () {
          createUnityInstance(canvas, config, function (progress) {
            fill.style.width = (100 * progress) + "%";
          }).then(function (instance) {
            window.unityInstance = instance;
            loading.style.display = "none";
            canvas.focus();
          }).catch(showError);
        };
        script.onerror = function () { showError("Não foi possível carregar o jogo. Recarregue a página."); };
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
